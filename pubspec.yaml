name: enough
description: "ENOUGH — A quiet app that gives you permission to stop."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  audioplayers: ^6.1.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

# App icon configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#151210"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  min_sdk_android: 21

# Native splash screen configuration
flutter_native_splash:
  color: "#151210"
  android_12:
    color: "#151210"
  ios: true
  android: true

flutter:
  uses-material-design: true

  assets:
    - assets/icon/
    - assets/audio/
